name: PySide6 Desktop

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt
        run: python -m pip install -r desktop/requirements.txt
      - name: Test calculation bridge
        run: dotnet test tests/AutoSwshRng.Cli.Tests/AutoSwshRng.Cli.Tests.csproj --artifacts-path artifacts --verbosity minimal
      - name: Test desktop interactions
        shell: pwsh
        run: |
          $env:SWSH_RNG_BACKEND = Join-Path $PWD 'artifacts/bin/AutoSwshRng.Cli/debug/AutoSwshRng.Cli.exe'
          python -m unittest discover -s desktop/tests -v
      - name: Publish calculation service
        run: dotnet publish src/AutoSwshRng.Cli/AutoSwshRng.Cli.csproj -c Release --self-contained false --output desktop/backend
      - name: Upload desktop preview
        uses: actions/upload-artifact@v4
        with:
          name: swsh-pyside6-preview-windows
          path: |
            desktop/**
            !desktop/**/__pycache__/**
            !desktop/tests/**
            !desktop/artifacts/**
