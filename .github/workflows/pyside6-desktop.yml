name: PySide6 Desktop

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      owoow_commit:
        description: '可选：官方 owoow 的 40 位候选提交，仅测试兼容性，不发布'
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt
        run: python -m pip install -r desktop/requirements.txt
      - name: Prepare optional upstream compatibility trial
        if: github.event_name == 'workflow_dispatch' && inputs.owoow_commit != ''
        env:
          OWOOW_COMMIT: ${{ inputs.owoow_commit }}
        run: python tools/prepare_owoow_trial.py "$env:OWOOW_COMMIT"
      - name: Verify pinned core and Chinese resources
        run: python tools/check_owoow.py
      - name: Test calculation bridge
        run: dotnet test tests/AutoSwshRng.Cli.Tests/AutoSwshRng.Cli.Tests.csproj --artifacts-path artifacts --verbosity minimal
      - name: Test upstream adapters
        run: dotnet test tests/AutoSwshRng.Upstream.Tests/AutoSwshRng.Upstream.Tests.csproj --artifacts-path artifacts --filter FullyQualifiedName~Owoow --verbosity minimal
      - name: Test desktop interactions
        shell: pwsh
        run: |
          $env:SWSH_RNG_BACKEND = Join-Path $PWD 'artifacts/bin/AutoSwshRng.Cli/debug/AutoSwshRng.Cli.exe'
          python -m unittest discover -s desktop/tests -v
      - name: Publish calculation service
        if: inputs.owoow_commit == ''
        # EasyCon's project graph can reach the same Avalonia resources through
        # multiple references. Serialize publishing to avoid writing them twice.
        run: dotnet publish src/AutoSwshRng.Cli/AutoSwshRng.Cli.csproj -c Release --self-contained false --artifacts-path artifacts --output desktop/backend -m:1 -p:BuildInParallel=false
      - name: Upload desktop preview
        if: inputs.owoow_commit == ''
        uses: actions/upload-artifact@v4
        with:
          name: swsh-pyside6-preview-windows
          path: |
            desktop/**
            !desktop/**/__pycache__/**
            !desktop/tests/**
            !desktop/artifacts/**
